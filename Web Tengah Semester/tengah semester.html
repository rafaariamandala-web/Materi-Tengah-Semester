<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuis Pembelajaran - Catatan Sekolah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between"
  >
    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-graduation-cap"></i> Kuis Catatan Sekolah
        </h1>
        <span
          class="text-xs bg-indigo-900 px-3 py-1 rounded-full text-indigo-200"
          >GitHub Ready</span
        >
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 flex-grow my-6">
      <!-- Screen 1: Pilih Mapel -->
      <div
        id="subject-screen"
        class="bg-white p-6 rounded-2xl shadow-md border border-slate-200"
      >
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">
          Pilih Mata Pelajaran
        </h2>
        <p class="text-slate-500 text-center mb-6 text-sm">
          Pilih topik materi kuis yang ingin kamu uji hari ini:
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- B. Indo -->
          <button
            onclick="startQuiz('bindo')"
            class="flex items-center p-4 border-2 border-indigo-100 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition text-left group"
          >
            <div
              class="p-3 rounded-lg bg-indigo-500 text-white group-hover:scale-110 transition"
            >
              <i class="fa-solid fa-book text-xl"></i>
            </div>
            <div class="ml-4">
              <h3 class="font-bold text-slate-800">Bahasa Indonesia</h3>
              <p class="text-xs text-slate-500">
                EYD, Diakritik, & Teks Prosedur
              </p>
            </div>
          </button>

          <!-- Sejarah -->
          <button
            onclick="startQuiz('sejarah')"
            class="flex items-center p-4 border-2 border-amber-100 rounded-xl hover:border-amber-500 hover:bg-amber-50 transition text-left group"
          >
            <div
              class="p-3 rounded-lg bg-amber-500 text-white group-hover:scale-110 transition"
            >
              <i class="fa-solid fa-landmark text-xl"></i>
            </div>
            <div class="ml-4">
              <h3 class="font-bold text-slate-800">Sejarah</h3>
              <p class="text-xs text-slate-500">
                Peran Manusia, Ruang, & Waktu
              </p>
            </div>
          </button>

          <!-- PPKn -->
          <button
            onclick="startQuiz('pkn')"
            class="flex items-center p-4 border-2 border-emerald-100 rounded-xl hover:border-emerald-500 hover:bg-emerald-50 transition text-left group"
          >
            <div
              class="p-3 rounded-lg bg-emerald-500 text-white group-hover:scale-110 transition"
            >
              <i class="fa-solid fa-flag text-xl"></i>
            </div>
            <div class="ml-4">
              <h3 class="font-bold text-slate-800">PPKn</h3>
              <p class="text-xs text-slate-500">
                Aturan Penggunaan Huruf Kapital
              </p>
            </div>
          </button>

          <!-- PAI -->
          <button
            onclick="startQuiz('pai')"
            class="flex items-center p-4 border-2 border-teal-100 rounded-xl hover:border-teal-500 hover:bg-teal-50 transition text-left group"
          >
            <div
              class="p-3 rounded-lg bg-teal-500 text-white group-hover:scale-110 transition"
            >
              <i class="fa-solid fa-mosque text-xl"></i>
            </div>
            <div class="ml-4">
              <h3 class="font-bold text-slate-800">PAI</h3>
              <p class="text-xs text-slate-500">
                Penulisan Istilah & Kitab Keagamaan
              </p>
            </div>
          </button>
        </div>
      </div>

      <!-- Screen 2: Kuis -->
      <div
        id="quiz-screen"
        class="hidden bg-white p-6 rounded-2xl shadow-md border border-slate-200"
      >
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <span
            id="quiz-title"
            class="font-bold text-indigo-600 text-sm uppercase tracking-wider"
            >Mata Pelajaran</span
          >
          <span
            id="question-count"
            class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium"
            >Soal 1/5</span
          >
        </div>

        <div id="question-container" class="mb-6">
          <h3 id="question-text" class="text-lg font-bold text-slate-800 mb-4">
            Pertanyaan akan muncul di sini?
          </h3>
          <div id="options-container" class="space-y-3">
            <!-- Pilihan ganda akan dirender via JS -->
          </div>
        </div>

        <div class="flex justify-between items-center pt-4 border-t">
          <button
            onclick="goHome()"
            class="text-sm text-slate-500 hover:text-slate-800 flex items-center gap-1"
          >
            <i class="fa-solid fa-arrow-left"></i> Kembali
          </button>
          <button
            id="next-btn"
            onclick="nextQuestion()"
            class="hidden bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition"
          >
            Lanjut <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>

      <!-- Screen 3: Hasil -->
      <div
        id="result-screen"
        class="hidden bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center"
      >
        <div
          class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"
        >
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-1">Kuis Selesai!</h2>
        <p class="text-slate-500 text-sm mb-6">
          Berikut adalah skor akhir dari kuis kamu:
        </p>

        <div class="bg-slate-50 p-4 rounded-xl max-w-xs mx-auto mb-6 border">
          <span id="score-text" class="text-4xl font-extrabold text-indigo-600"
            >0 / 0</span
          >
          <p id="feedback-text" class="text-xs text-slate-500 mt-2">
            Tetap semangat belajar!
          </p>
        </div>

        <button
          onclick="goHome()"
          class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition"
        >
          Coba Kuis Lain
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-slate-400">
      Created with <i class="fa-solid fa-heart text-red-400"></i> for Github
      Pages
    </footer>

    <!-- JavaScript Data & Logic -->
    <script>
      const quizData = {
        bindo: {
          title: "Bahasa Indonesia (Teks Prosedur & Diakritik)",
          questions: [
            {
              question:
                "Menurut KBBI, teks prosedur merupakan teks yang berisi...",
              options: [
                "Cerita fiksi secara berurutan",
                "Tahapan kegiatan untuk menyelesaikan suatu aktivitas secara pasti",
                "Pendapat pribadi penulis tentang suatu isu",
                "Daftar istilah kata-kata sulit",
              ],
              answer: 1,
            },
            {
              question:
                "Manakah di bawah ini yang MERUPAKAN struktur utama dari teks prosedur?",
              options: [
                "Orientasi, Komplikasi, Resolusi",
                "Pernyataan Umum, Deretan Penjelas",
                "Tujuan, Material (Alat & Bahan), Langkah-langkah, Penutup",
                "Tesis, Argumentasi, Penegasan Ulang",
              ],
              answer: 2,
            },
            {
              question:
                "Fungsi utama dari 'Alat' dalam bagian Material teks prosedur adalah...",
              options: [
                "Menjadi bahan utama yang akan diolah",
                "Membuat teks menjadi lebih panjang",
                "Membantu melengkapi setiap langkah-langkah",
                "Sebagai penutup atau kesimpulan",
              ],
              answer: 2,
            },
            {
              question:
                "Penggunaan tanda diakritik /ê/ tepat digunakan pada kata...",
              options: ["Sêhat", "Mêrah", "Bêrat", "Pêsta"],
              answer: 2,
            },
          ],
        },
        sejarah: {
          title: "Sejarah (Peran Manusia, Ruang, & Waktu)",
          questions: [
            {
              question:
                "Dalam sejarah, manusia yang memelopori atau memulai perubahan/peristiwa disebut sebagai...",
              options: [
                "Pelaku (The Actor)",
                "Penggerak (The Mover)",
                "Saksi (The Witness)",
                "Penonton",
              ],
              answer: 1,
            },
            {
              question:
                "Unsur utama dalam peristiwa sejarah terdiri dari 3 hal, yaitu...",
              options: [
                "Manusia, Ruang, dan Waktu",
                "Naskah, Tokoh, dan Tempat",
                "Masa Lalu, Masa Depan, dan Cita-cita",
                "Sebab, Akibat, dan Solusi",
              ],
              answer: 0,
            },
            {
              question:
                "Seseorang yang tidak terlibat langsung tetapi melihat peristiwa sejarah dinamakan...",
              options: ["The Mover", "The Actor", "The Witness", "The Writer"],
              answer: 2,
            },
          ],
        },
        pkn: {
          title: "PPKn (Aturan Huruf Kapital)",
          questions: [
            {
              question:
                "Manakah penulisan gelar dan nama orang yang BENAR sesuai aturan EYD?",
              options: [
                "dr. mahfud M.si",
                "Dr. Mahfud, M.Si.",
                "dr. Mahfud, m.si",
                "DR. mahfud M.SI",
              ],
              answer: 1,
            },
            {
              question:
                "Penulisan nama bangsa dan suku yang tepat di bawah ini adalah...",
              options: [
                "bangsa Indonesia, suku Jawa",
                "Bangsa indonesia, Suku jawa",
                "BANGSA INDONESIA, SUKU JAWA",
                "bangsa indonesia, suku jawa",
              ],
              answer: 0,
            },
            {
              question:
                "Huruf kapital digunakan pada awal kata unsur geografi jika...",
              options: [
                "Berdiri sendiri tanpa nama diri",
                "Diikuti oleh nama diri geografi (misal: Sungai Kapuas)",
                "Digunakan sebagai nama jenis makanan",
                "Ditulis di akhir kalimat saja",
              ],
              answer: 1,
            },
          ],
        },
        pai: {
          title: "PAI (Penulisan Kitab & Istilah Keagamaan)",
          questions: [
            {
              question:
                "Penulisan nama kitab suci keagamaan harus diawali dengan huruf...",
              options: ["Kecil", "Kapital", "Miring", "Tebal"],
              answer: 1,
            },
            {
              question:
                "Manakah penulisan nama kitab keagamaan yang sesuai dengan aturan tata bahasa?",
              options: [
                "al-qur'an dan alkitab",
                "Al-Qur'an dan Alkitab",
                "AL-QUR'AN dan ALKITAB",
                "Al-qur'an dan al-Kitab",
              ],
              answer: 1,
            },
          ],
        },
      };

      let currentSubject = "";
      let currentQuestionIndex = 0;
      let score = 0;

      function startQuiz(subjectKey) {
        currentSubject = subjectKey;
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById("subject-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        document.getElementById("quiz-title").innerText =
          quizData[subjectKey].title;
        showQuestion();
      }

      function showQuestion() {
        const subject = quizData[currentSubject];
        const q = subject.questions[currentQuestionIndex];

        document.getElementById("question-count").innerText =
          `Soal ${currentQuestionIndex + 1}/${subject.questions.length}`;
        document.getElementById("question-text").innerText = q.question;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        document.getElementById("next-btn").classList.add("hidden");

        q.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className =
            "w-full text-left p-3.5 border rounded-xl hover:bg-slate-50 transition flex items-center justify-between text-slate-700 text-sm font-medium";
          btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-slate-300"></i>`;
          btn.onclick = () => selectOption(idx, btn);
          optionsContainer.appendChild(btn);
        });
      }

      function selectOption(selectedIndex, selectedBtn) {
        const subject = quizData[currentSubject];
        const correctIndex = subject.questions[currentQuestionIndex].answer;
        const options = document.getElementById("options-container").children;

        // Nonaktifkan semua tombol pilihan
        for (let btn of options) {
          btn.disabled = true;
          btn.classList.remove("hover:bg-slate-50");
        }

        if (selectedIndex === correctIndex) {
          score++;
          selectedBtn.classList.add(
            "border-green-500",
            "bg-green-50",
            "text-green-700",
          );
          selectedBtn.querySelector("i").className =
            "fa-solid fa-circle-check text-green-500";
        } else {
          selectedBtn.classList.add(
            "border-red-500",
            "bg-red-50",
            "text-red-700",
          );
          selectedBtn.querySelector("i").className =
            "fa-solid fa-circle-xmark text-red-500";

          // Tunjukkan jawaban yang benar
          options[correctIndex].classList.add(
            "border-green-500",
            "bg-green-50",
            "text-green-700",
          );
          options[correctIndex].querySelector("i").className =
            "fa-solid fa-circle-check text-green-500";
        }

        document.getElementById("next-btn").classList.remove("hidden");
      }

      function nextQuestion() {
        const subject = quizData[currentSubject];
        currentQuestionIndex++;

        if (currentQuestionIndex < subject.questions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }

      function showResults() {
        const subject = quizData[currentSubject];
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        document.getElementById("score-text").innerText =
          `${score} / ${subject.questions.length}`;

        const percentage = (score / subject.questions.length) * 100;
        const feedback = document.getElementById("feedback-text");
        if (percentage === 100) {
          feedback.innerText =
            "Sempurna! Kamu menguasai materi ini dengan baik 🎉";
        } else if (percentage >= 50) {
          feedback.innerText =
            "Bagus! Teruskan belajar untuk hasil lebih baik 👍";
        } else {
          feedback.innerText =
            "Jangan menyerah, baca catatanmu lagi dan coba kembali 📚";
        }
      }

      function goHome() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("subject-screen").classList.remove("hidden");
      }
    </script>
  </body>
</html>
